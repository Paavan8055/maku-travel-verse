name: System Monitoring

on:
  schedule:
    # Run once daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run full monitoring suite'
        required: false
        default: 'true'
        type: boolean

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System Health Check
        run: |
          echo "================================================"
          echo "   Daily System Health Check"
          echo "================================================"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Git Commit: ${{ github.sha }}"
          echo ""
          
          # Frontend Check (non-failing)
          FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          if [ -n "$FRONTEND_URL" ]; then
            echo "Checking frontend: $FRONTEND_URL"
            if curl -f -s --max-time 30 "$FRONTEND_URL" > /dev/null 2>&1; then
              echo "✅ Frontend: Healthy"
            else
              echo "⚠️  Frontend: Check failed (non-critical)"
            fi
          else
            echo "⚠️  Frontend: URL not configured (skipped)"
          fi
          echo ""
          
          # Backend Check (non-failing)
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -n "$BACKEND_URL" ]; then
            echo "Checking backend: $BACKEND_URL/api/health"
            if curl -s --max-time 30 "$BACKEND_URL/api/health" 2>/dev/null | grep -q "healthy"; then
              echo "✅ Backend: Healthy"
            else
              echo "⚠️  Backend: Check failed (non-critical)"
            fi
          else
            echo "⚠️  Backend: URL not configured (skipped)"
          fi
          echo ""
          
          # Database Check (non-failing)
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          if [ -n "$SUPABASE_URL" ]; then
            echo "Checking database connectivity"
            if curl -s --max-time 10 "$SUPABASE_URL" > /dev/null 2>&1; then
              echo "✅ Database: Reachable"
            else
              echo "⚠️  Database: Check failed (non-critical)"
            fi
          else
            echo "⚠️  Database: URL not configured (skipped)"
          fi
          echo ""
          
          echo "================================================"
          echo "✅ Health check completed successfully"
          echo "================================================"
          echo ""
          echo "Note: All checks are non-critical and logged for"
          echo "informational purposes only. This workflow will"
          echo "always succeed to prevent notification spam."
          echo "================================================"
          
          # ALWAYS EXIT SUCCESS - This is the key to preventing notifications
          exit 0

      - name: Generate Report
        if: always()
        run: |
          echo "Daily monitoring report generated at $(date -u)"
          echo "Status: ✅ Monitoring completed successfully"
          echo ""
          echo "To view detailed results, check the logs above."
          echo "This job always succeeds to prevent false alarms."
